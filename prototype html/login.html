<body class="bg-background flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="bg-transparent flex items-center justify-center w-full px-margin-mobile md:px-margin-desktop flex-col pt-6 pb-1"><div class="flex items-center gap-sm justify-center mb-4"><span class="material-symbols-outlined text-[#333333] text-headline-md" style="color: rgb(51, 51, 51);">school</span><h1 class="font-headline-md text-headline-md font-bold text-[#333333]">EduConnect</h1></div><div class="flex justify-center"><span class="material-symbols-outlined" style="color: rgb(255, 153, 226); font-size: 80px;">school</span></div></header>
<main class="flex-grow flex flex-col items-center justify-start px-margin-mobile pb-lg pt-0">
<div class="w-full max-w-[360px] flex flex-col items-center">
<!-- Minimal Illustration -->
<!-- Welcome Text -->
<h2 class="font-headline-md text-[28px] text-[#1A1A1A] font-bold mb-8 text-center mt-4">Entrar no Aplicativo</h2>
<form class="w-full space-y-4">
<!-- Username -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full minimal-input rounded-xl py-4 pl-12 pr-4 outline-none transition-all font-body-md text-body-md placeholder:text-outline/60" id="username" placeholder="Nome de Usuário" type="text">
</div>
<!-- Password -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full minimal-input rounded-xl py-4 pl-12 pr-12 outline-none transition-all font-body-md text-body-md placeholder:text-outline/60" id="password" placeholder="Senha" type="password">
</div>
<!-- Login Button -->
<button class="w-full bg-[#8E8E8E] text-white font-bold py-3.5 rounded-full hover:bg-[#7A7A7A] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Forgot Password -->
<div class="text-center pt-2">
<a class="font-body-md text-[#8E8E8E] hover:text-[#333333] transition-colors" href="#">
                        Esqueceu a senha?
                    </a>
</div>
</form>
<div class="w-full mt-12 space-y-3">
<!-- Google Login -->
<!-- Create Account -->
<button class="w-full bg-[#D1C9FF] text-[#574fbe] font-bold py-3.5 rounded-full hover:bg-[#C4BAFF] active:scale-[0.98] transition-all">
                    Criar nova conta
                </button>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 px-margin-mobile md:px-margin-desktop border-t border-[#E0E0E0] mt-auto">
<div class="max-w-[1200px] mx-auto flex flex-col justify-between items-center gap-4 text-[#8E8E8E]"><div class="flex items-center justify-center gap-xs w-full">
<span class="font-label-md text-label-md font-bold text-[#333333]">EduConnect</span>
<span class="font-body-sm text-body-sm">© 2026</span>
</div></div>
</footer>
